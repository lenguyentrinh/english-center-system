services:
  mysql:
    image: mysql:8.4
    container_name: english-center-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: english_center_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: english-center-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      # Defaults to the bundled mysql container; set MYSQL_URL/MYSQL_USER/MYSQL_PASSWORD in .env to use an external MySQL (see .env.example)
      MYSQL_URL: ${MYSQL_URL:-jdbc:mysql://mysql:3306/english_center_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-root}}
      JWT_SECRET: ${JWT_SECRET:-secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      TIMEZONE: Asia/Ho_Chi_Minh
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # Pass-through: only set in the container when defined in .env (an empty host would create a broken mail sender).
      SPRING_MAIL_HOST:
      SPRING_MAIL_PORT:
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
      # Optional first admin, created on startup only when all three are set in .env
      ADMIN_USERNAME:
      ADMIN_EMAIL:
      ADMIN_PASSWORD:
      # Dev only: SEED_DEMO_USERS=true creates admin/teacher/student demo accounts (needs the dev profile)
      SEED_DEMO_USERS:
      DEMO_USER_PASSWORD:
      # Dev only: SEED_CURRICULUM=true creates the grade 1-12 courses from seed/curriculum.json
      SEED_CURRICULUM:
      MAIL_FROM: ${MAIL_FROM:-no-reply@english-center.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-5}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: english-center-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
