services:
  mongo:
    image: mongo:7
    container_name: english-center-mongo
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: english-center-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/english_center_db
      JWT_SECRET: ${JWT_SECRET:-secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      TIMEZONE: Asia/Ho_Chi_Minh
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: english-center-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo_data:
